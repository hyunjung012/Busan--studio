const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let pages=[],idx=0,sel=0,kind='cover',drag=null;const names={cover:'썸네일',menu:'메뉴 리뷰',info:'매장 정보',end:'마지막 장'};const T=(text,x,y,size,bold=false,align='center',color='#ffffff',highlight=false)=>({text,x,y,size,bold,align,color,highlight,hl:'#ffeb68',font:'sans-serif',underline:false,leading:135,spacing:0,stroke:0,strokeColor:'#000000',opacity:100});function make(k){let p={kind:k,bg:k==='end'?'#faf4eb':'#383838',shade:k==='end'?0:75,zoom:100,px:0,py:0,ratio:1350,photo:null,items:[]};if(k==='cover')p.items=[T('부산\n남포동\n맛집추천',65,910,78,true,'left')];if(k==='menu')p.items=[T('추천메뉴',540,820,44,true),T('메뉴 이름',540,970,34,true,'center','#111111',true),T('메뉴에 대한 후기를 입력하세요.\n사진과 글을 자유롭게 바꿔보세요.',540,1030,30),T('★★★★★ 5/5',540,1180,32,false,'center','#ffdb65'),T('1',540,1290,25)];if(k==='info')p.items=[T('매장 이름',540,820,48,true),T('주소를 입력하세요\n11:00 - 21:00\n라스트오더\n정기휴무',540,970,32),T('3',540,1290,25)];if(k==='end')p.items=[T('busan_hyeonjiin',330,555,32,true,'left','#111111'),T('부산 현지인 | 부산맛집 부산카페',330,605,22,false,'left','#777777'),T('부산 현지인의\n맛집 리스트가 궁금하다면\n팔로우해 주세요! 🧡',540,780,40,true,'center','#111111')];return p}const p=()=>pages[idx],t=()=>p().items[sel];let cache=new Map();function draw(){let a=p();if(cv.height!==+a.ratio)cv.height=+a.ratio;let h=cv.height,s=h/1350;ctx.fillStyle=a.bg;ctx.fillRect(0,0,1080,h);if(a.photo){let im=cache.get(a.photo);if(!im){im=new Image();cache.set(a.photo,im);im.onload=draw;im.src=a.photo}if(im.complete&&im.naturalWidth){let z=Math.max(1080/im.width,h/im.height)*a.zoom/100,w=im.width*z,b=im.height*z;ctx.drawImage(im,(1080-w)/2+a.px,(h-b)/2+a.py,w,b)}}if(a.shade){let g=ctx.createLinearGradient(0,h*(a.shadeStart??25)/100,0,h);g.addColorStop(0,'transparent');g.addColorStop(1,`rgba(0,0,0,${a.shade/100})`);ctx.fillStyle=g;ctx.fillRect(0,0,1080,h)}if(a.kind==='end'){ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(160,500*s,760,170*s,32);ctx.fill();ctx.fillStyle='#e66b43';ctx.beginPath();ctx.arc(235,585*s,50,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='italic 23px serif';ctx.textAlign='center';ctx.fillText('Busan',235,580*s);ctx.fillText('Food',235,606*s);let li=cache.get(brandLogo);if(!li){li=new Image();cache.set(brandLogo,li);li.onload=draw;li.src=brandLogo}if(li.complete&&li.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(235,585*s,50,0,Math.PI*2);ctx.clip();ctx.drawImage(li,185,585*s-50,100,100);ctx.restore()};ctx.fillStyle='#0095f6';ctx.beginPath();ctx.roundRect(750,550*s,140,60,15);ctx.fill();ctx.fillStyle='white';ctx.font='bold 25px sans-serif';ctx.fillText('팔로우',820,588*s)}a.items.forEach(e=>{ctx.font=`${e.bold?'bold ':''}${e.size}px ${e.font}`;ctx.textAlign=e.align;ctx.textBaseline='middle';ctx.save();ctx.globalAlpha=(e.opacity??100)/100;if('letterSpacing' in ctx)ctx.letterSpacing=(e.spacing??0)+'px';e.text.split('\n').forEach((line,i)=>{let y=e.y*s+i*e.size*(e.leading??135)/100,w=ctx.measureText(line).width,x=e.align==='center'?e.x-w/2:e.align==='right'?e.x-w:e.x;if(e.highlight){ctx.fillStyle=e.hl;ctx.fillRect(x-5,y-e.size*.56,w+10,e.size*1.12)}ctx.fillStyle=e.color;if(e.stroke){ctx.strokeStyle=e.strokeColor;ctx.lineWidth=e.stroke;ctx.lineJoin="round";ctx.strokeText(line,e.x,y)}ctx.fillText(line,e.x,y);if(e.underline)ctx.fillRect(x,y+e.size*.48,w,Math.max(2,e.size*.05))});ctx.restore()})}function sync(){let a=p();$('pages').innerHTML='';pages.forEach((v,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${names[v.kind]}`;b.className=i===idx?'active':'';b.onclick=()=>{idx=i;sel=0;sync()};$('pages').append(b)});$('elements').innerHTML='';a.items.forEach((e,i)=>{let o=document.createElement('option');o.value=i;o.textContent=e.text.slice(0,20)||'빈 글자';$('elements').append(o)});$('elements').value=sel;let e=t();if(e){$('content').value=e.text;for(let k of ['size','color','font','align'])$(k).value=e[k];$('highlight').value=e.hl;$('hlOn').checked=e.highlight;$('bold').checked=e.bold;$('underline')
